<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">Trust and control in semi-autonomous vehicles</title><desc id="desc">Three themes from an exploratory interview study: perceived competence, negotiated control and communication in context, connected to understanding trust.</desc><rect width="960" height="580" rx="16" fill="#11191b"/><text x="50" y="65" fill="#e7b626" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">QUALITATIVE RESEARCH · FALL 2025</text><text x="50" y="125" fill="#f2f4ef" font-family="Arial,sans-serif" font-size="34" font-weight="600">How drivers make sense of automation</text><text x="50" y="164" fill="#b7c3c0" font-family="Arial,sans-serif" font-size="18">Three themes developed from two driver interviews</text><g fill="none" stroke="#6b776e" stroke-width="2"><path d="M190 356V412H770V356M480 356V455"/></g><g font-family="Arial,sans-serif"><rect x="50" y="224" width="280" height="132" rx="8" fill="#192426" stroke="#3e4b47"/><text x="72" y="260" fill="#e7b626" font-size="15">01</text><text x="72" y="294" fill="#f2f4ef" font-size="21">Perceived competence</text><text x="72" y="325" fill="#b7c3c0" font-size="17">Understanding capabilities</text><rect x="340" y="224" width="280" height="132" rx="8" fill="#192426" stroke="#3e4b47"/><text x="362" y="260" fill="#e7b626" font-size="15">02</text><text x="362" y="294" fill="#f2f4ef" font-size="21">Negotiated control</text><text x="362" y="325" fill="#b7c3c0" font-size="17">Understanding one's role</text><rect x="630" y="224" width="280" height="132" rx="8" fill="#192426" stroke="#3e4b47"/><text x="652" y="260" fill="#e7b626" font-size="15">03</text><text x="652" y="294" fill="#f2f4ef" font-size="21">Communication</text><text x="652" y="325" fill="#b7c3c0" font-size="17">Interpreting system signals</text><rect x="270" y="455" width="420" height="65" rx="8" fill="#e7b626"/><text x="480" y="496" fill="#11191b" text-anchor="mid